<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
<title>Agenda - Prefeitura de Presidente Prudente</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet">
<!-- `defer` — pedido do usuário (2026-09-15): "no modo mobile estou tendo
     dificuldade de acessar, esta demorando muito para conectar". Achado
     real: esses 5 scripts somam ~1,5MB (xlsx.full.min.js sozinho já é
     861KB) e, sem `defer`, o navegador é OBRIGADO a baixar e executar
     TUDO isso antes de conseguir desenhar até a tela de LOGIN — que não
     usa nenhuma dessas bibliotecas. Em rede móvel (3G/4G instável), isso
     sozinho pode significar vários segundos de tela em branco antes do
     formulário aparecer. `defer` deixa o HTML renderizar em paralelo ao
     download, executando os scripts só depois, na mesma ordem relativa,
     ainda antes do DOMContentLoaded — seguro aqui porque FullCalendar/
     XLSX/jsPDF só são usados DENTRO de funções (iniciarCalendario,
     exportarExcel, exportarPDF...), chamadas bem depois do login, nunca
     no nível superior do script. -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/locales/pt-br.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js" defer></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#f0f2f5;color:#1a2a3a;overflow-x:hidden}

/* ── Login ── */
.login-page{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#004d99,#003366);padding:16px}
.login-card{background:#fff;border-radius:24px;padding:36px 28px;width:100%;max-width:440px;box-shadow:0 20px 40px rgba(0,0,0,.2);text-align:center}
.login-logo{max-width:200px;height:auto;margin-bottom:16px}
.sidebar-logo{max-width:130px;height:auto;margin-bottom:8px}
.login-card h1{font-size:22px;color:#003366;margin-bottom:4px}
.login-card p{color:#666;font-size:14px;margin-bottom:24px}
.form-group{margin-bottom:16px;text-align:left}
.form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:#333}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:11px 14px;border:1px solid #ddd;border-radius:10px;font-family:inherit;font-size:14px;outline:none;transition:border .2s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:#004d99}
.senha-wrap{position:relative}
.senha-wrap input{padding-right:42px!important}
.senha-toggle{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:6px;line-height:1;display:flex;align-items:center;color:#ddd;transition:color .2s}
.senha-toggle:hover{color:#aaa}
.aviso-espaco-senha{display:none;color:#dc3545;font-size:11px;margin-top:5px}
.form-group textarea{resize:vertical;min-height:80px}
.btn-primary{width:100%;padding:13px;background:#004d99;color:#fff;border:none;border-radius:40px;font-size:15px;font-weight:600;cursor:pointer;transition:background .2s}
.btn-primary:hover{background:#003366}
.erro{background:#f8d7da;color:#721c24;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none}
.sucesso{background:#d4edda;color:#155724;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none}
.login-links{margin-top:18px;display:flex;justify-content:center;gap:24px;font-size:13px}
.login-links a{color:#004d99;text-decoration:none;font-weight:500}
.login-links a:hover{text-decoration:underline}

/* ── Layout ── */
.app{display:flex;min-height:100vh}
.sidebar{width:270px;background:#003366;color:#fff;position:fixed;height:100vh;overflow-y:auto;z-index:100;transition:transform .3s}
.sidebar.pref-sidebar{background:#7b0000}
.sidebar-header{padding:20px 16px;border-bottom:1px solid rgba(255,255,255,.15);text-align:center}
.sidebar-header h3{font-size:16px;margin-bottom:6px}
.orgao-badge{display:inline-block;background:#ff9900;color:#003366;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.orgao-badge.pref-badge{background:#ff4444;color:#fff}
.sidebar-nav{padding:12px}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;color:rgba(255,255,255,.8);cursor:pointer;margin-bottom:4px;font-size:14px;transition:all .2s}
.nav-item:hover,.nav-item.active{background:rgba(255,255,255,.15);color:#fff}
.sidebar-footer{padding:14px 16px;border-top:1px solid rgba(255,255,255,.15);font-size:12px;color:rgba(255,255,255,.7)}
.btn-logout{width:100%;margin-top:10px;padding:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:8px;color:#fff;cursor:pointer;font-size:13px}
.btn-logout:hover{background:rgba(255,255,255,.2)}

.main{flex:1;margin-left:270px;width:calc(100% - 270px);padding:20px;max-width:100%;overflow-x:hidden}
.view{display:none;animation:fadeIn .25s}
.view.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ── Cards stat ── */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.stat-card{background:#fff;border-radius:14px;padding:18px;display:flex;align-items:center;gap:14px;box-shadow:0 2px 8px rgba(0,0,0,.06);cursor:pointer;transition:all .2s}
.stat-card:hover{transform:translateY(-3px);box-shadow:0 6px 16px rgba(0,0,0,.1)}
.stat-icon{font-size:36px}
.stat-info h3{font-size:26px;color:#003366}
.stat-info p{font-size:13px;color:#666}

/* ── Seção ── */
.secao{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:20px}
.secao-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.secao-header h2{font-size:18px;color:#003366}

/* ── Botões ── */
.btn{padding:9px 18px;border:none;border-radius:30px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.btn-azul{background:#004d99;color:#fff}.btn-azul:hover{background:#003a73}
.btn-verde{background:#28a745;color:#fff}.btn-verde:hover{background:#218838}
.btn-vermelho{background:#dc3545;color:#fff}.btn-vermelho:hover{background:#b02a37}
.btn-cinza{background:#6c757d;color:#fff}.btn-cinza:hover{background:#545b62}
.btn-amarelo{background:#ffc107;color:#212529}.btn-amarelo:hover{background:#e0a800}
.btn-outline{background:transparent;border:1px solid #004d99;color:#004d99}.btn-outline:hover{background:#004d99;color:#fff}
.btn-pdf{background:#dc3545;color:#fff}.btn-pdf:hover{background:#b02a37}
.btns-row{display:flex;gap:10px;flex-wrap:wrap}
.dias-semana-grid{display:flex;gap:10px;flex-wrap:wrap;padding:9px 0}
.dias-semana-grid label{display:flex;align-items:center;gap:5px;font-size:13px;cursor:pointer;user-select:none}
.dias-semana-grid input{cursor:pointer;width:16px;height:16px;flex-shrink:0;margin:0}

/* ── Eventos lista ── */
.evento-card{background:#fff;border-radius:14px;padding:18px;border-left:5px solid #004d99;box-shadow:0 2px 6px rgba(0,0,0,.06);cursor:pointer;transition:all .2s;margin-bottom:12px}
.evento-card:hover{transform:translateX(4px)}
.evento-card.prefeito{border-left-color:#dc3545;background:#fff8f8}
.evento-titulo{font-size:16px;font-weight:700;color:#003366;margin-bottom:10px}
.evento-card.prefeito .evento-titulo{color:#dc3545}
.evento-card.fundosocial{border-left-color:#7b2cbf;background:#f8f2fc}
.evento-card.fundosocial .evento-titulo{color:#7b2cbf}
.evento-card.recorrente{border-left-color:#8fd19e;background:#eefaf0}
.evento-card.recorrente .evento-titulo{color:#000}
.evento-meta{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:#555}
.evento-meta span{display:flex;align-items:center;gap:4px}
.tag-prefeito{background:#dc3545;color:#fff;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700;margin-left:8px}
.tag-fundosocial{background:#7b2cbf;color:#fff;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700;margin-left:8px}
.tag-recorrente{background:#8fd19e;color:#000;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700;margin-left:8px}
.tag-orgao{background:#e8f0fe;color:#003366;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600}

/* ── Modal ── */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:999;align-items:center;justify-content:center;padding:16px}
.modal-bg.aberto{display:flex}
.modal-box{background:#fff;border-radius:20px;width:100%;max-width:680px;max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column}
.modal-head{padding:18px 22px;background:#003366;color:#fff;border-radius:20px 20px 0 0;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:1}
.modal-head.prefeito-head{background:#dc3545}
.modal-head.fundosocial-head{background:#7b2cbf}
.modal-head h3{font-size:17px}
.modal-close{font-size:26px;cursor:pointer;line-height:1;background:none;border:none;color:#fff}
.modal-body{padding:22px;flex:1}
.modal-footer{padding:14px 22px;border-top:1px solid #eee;display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.info-linha{display:flex;padding:9px 0;border-bottom:1px solid #f5f5f5}
.info-label{font-weight:700;color:#003366;width:120px;flex-shrink:0;font-size:14px}
.info-valor{flex:1;color:#333;font-size:14px;word-break:break-word}

/* ── Calendário ── */
.fc-event{cursor:pointer!important;font-size:12px!important;padding:4px 6px!important;border-radius:6px!important;white-space:normal!important;word-break:break-word!important;display:block!important}
.fc-event .fc-event-time{display:none!important}
.prefeito-event{background:#dc3545!important;border-color:#b02a37!important;color:#fff!important}
.prefeito-event-mobile{background:#dc3545!important;border-color:#b02a37!important;color:#fff!important}
.fundosocial-event{background:#7b2cbf!important;border-color:#5a1e94!important;color:#fff!important}
.fundosocial-event-mobile{background:#7b2cbf!important;border-color:#5a1e94!important;color:#fff!important}
.recorrente-event{background:#c3e6cb!important;border-color:#8fd19e!important;color:#000!important;--fc-event-text-color:#000}
.recorrente-event-mobile{background:#c3e6cb!important;border-color:#8fd19e!important;color:#000!important;--fc-event-text-color:#000}
.recorrente-event .fc-event-main,.recorrente-event .fc-event-title,.recorrente-event .fc-event-time,
.recorrente-event-mobile .fc-event-main,.recorrente-event-mobile .fc-event-title,.recorrente-event-mobile .fc-event-time{color:#000!important}
.prefeito-event .fc-list-event-dot,.prefeito-event-mobile .fc-list-event-dot,
.prefeito-event .fc-daygrid-event-dot,.prefeito-event-mobile .fc-daygrid-event-dot{border-color:#dc3545!important}
.fundosocial-event .fc-list-event-dot,.fundosocial-event-mobile .fc-list-event-dot,
.fundosocial-event .fc-daygrid-event-dot,.fundosocial-event-mobile .fc-daygrid-event-dot{border-color:#7b2cbf!important}
.recorrente-event .fc-list-event-dot,.recorrente-event-mobile .fc-list-event-dot,
.recorrente-event .fc-daygrid-event-dot,.recorrente-event-mobile .fc-daygrid-event-dot{border-color:#8fd19e!important}
.fc-view-harness{min-height:500px}
.fc-toolbar-title{font-size:18px!important}
.fc-button{padding:6px 12px!important;font-size:14px!important}
.fc-col-header-cell-cushion{font-size:14px!important;font-weight:600!important}
.fc-daygrid-day-number{font-size:14px}

/* ── Tabela ── */
.tabela-wrap{overflow-x:auto;border-radius:12px}
.tabela-wrap table{width:100%;border-collapse:collapse;min-width:700px}
.tabela-wrap th,.tabela-wrap td{padding:11px 12px;text-align:left;font-size:13px;border-bottom:1px solid #f0f0f0}
.tabela-wrap th{background:#f8f9fa;font-weight:600;color:#003366;white-space:nowrap}
.tabela-wrap tr:hover td{background:#f8f9fa}
.tabela-wrap tr.pref-row td{background:#fff5f5}
.tabela-wrap tr.pref-row:hover td{background:#ffe8e8}
.tabela-wrap tr.fundosocial-row td{background:#f8f2fc}
.tabela-wrap tr.fundosocial-row:hover td{background:#efe0fa}
.tabela-wrap tr.recorrente-row td{background:#eefaf0}
.tabela-wrap tr.recorrente-row:hover td{background:#d9f2df}

/* ── Badge notificação ── */
.badge{background:#dc3545;color:#fff;border-radius:10px;padding:1px 6px;font-size:11px;font-weight:700;margin-left:4px}

/* ── Dashboard dois colunas ── */
.dashboard-dois-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start;margin-bottom:20px}

/* ── Eventos de Hoje ── */
.eventos-hoje-container{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.eventos-hoje-container h3{font-size:15px;color:#003366;margin-bottom:14px}
.eventos-hoje-lista{max-height:400px;overflow-y:auto}
.evento-hoje-card{background:#f8f9fa;border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer;border-left:4px solid #004d99;transition:background .2s}
.evento-hoje-card:hover{background:#e8f0fe}
.evento-hoje-card.prefeito{border-left-color:#dc3545;background:#fff5f5}
.evento-hoje-card.fundosocial{border-left-color:#7b2cbf;background:#f8f2fc}
.evento-hoje-card.recorrente{border-left-color:#8fd19e;background:#eefaf0}
.evento-hoje-titulo{font-weight:700;margin-bottom:6px;color:#003366;font-size:14px}
.evento-hoje-card.prefeito .evento-hoje-titulo{color:#dc3545}
.evento-hoje-card.fundosocial .evento-hoje-titulo{color:#7b2cbf}
.evento-hoje-card.recorrente .evento-hoje-titulo{color:#000}
.evento-hoje-info{font-size:12px;color:#666;margin-bottom:2px}

/* ── Progress bar upload ── */
.progress-bar-container{width:100%;height:8px;background:#e0e0e0;border-radius:4px;margin-top:10px;overflow:hidden;display:none}
.progress-bar-fill{height:100%;background:#004d99;width:0%;transition:width .3s;border-radius:4px}

/* ── Mobile ── */
.menu-toggle{display:none;position:fixed;top:10px;left:10px;z-index:200;background:#003366;color:#fff;border:none;border-radius:50%;width:44px;height:44px;font-size:20px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99}
.overlay.ativo{display:block}
.alerta-retroativo{font-size:12px;color:#dc3545;margin-top:4px;display:none}
.empty{text-align:center;padding:32px;color:#999;font-size:14px}
.btn{min-height:40px}
.form-group input,.form-group select,.form-group textarea{font-size:16px!important}

@media(max-width:768px){
  /* Layout */
  .sidebar{transform:translateX(-100%);width:260px}
  .sidebar.aberta{transform:translateX(0)}
  .main{margin-left:0;width:100%;padding:12px;padding-top:62px}
  .menu-toggle{display:flex;align-items:center;justify-content:center}

  /* Cards */
  .stats-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .stat-card{padding:12px}
  .stat-icon{font-size:28px}
  .stat-info h3{font-size:20px}

  /* Seções e botões */
  .secao{padding:14px}
  .secao-header{flex-direction:column;align-items:flex-start}
  .secao-header .btns-row{width:100%}
  .btn{padding:10px 14px;font-size:13px}
  .btns-row{gap:8px;justify-content:center}
  .btns-row .btn{flex:1;text-align:center;justify-content:center}

  /* Formulários */
  [style*="grid-template-columns:1fr 1fr"]{display:block!important}
  [style*="grid-template-columns:1fr 1fr"]>.form-group{margin-bottom:12px}
  [style*="grid-template-columns:1fr 2fr"]{display:block!important}
  [style*="grid-template-columns:1fr 2fr"]>.form-group{margin-bottom:12px}

  /* Tabela */
  .tabela-wrap table{min-width:600px}

  /* Modal — sobe da base da tela */
  .modal-bg{align-items:flex-end;padding:0}
  .modal-box{border-radius:16px 16px 0 0;max-height:95vh;margin-top:auto}
  .modal-footer{flex-direction:column}
  .modal-footer .btn{width:100%;justify-content:center}
  .info-linha{flex-direction:column}
  .info-label{width:100%;margin-bottom:2px}

  /* Dashboard grid vira 1 coluna */
  .dashboard-dois-col{grid-template-columns:1fr!important}

  /* Calendário mobile: nada de encolher (zoom/scale) nem rolar (min-width) — o FullCalendar já é
     fluido por natureza, então deixamos ele ocupar 100% da largura e só reduzimos fonte/espaçamento
     das células pra caber as 7 colunas sem cortar nem forçar rolagem. */
  #calendario .secao{padding:0;border-radius:0;box-shadow:none}
  .fc-view-harness{height:auto!important;min-height:280px!important}
  .fc-toolbar{flex-direction:column!important;gap:4px!important;align-items:center!important}
  .fc-toolbar-chunk{text-align:center!important}
  .fc-col-header-cell-cushion{font-size:11px!important;padding:2px!important}
  .fc-daygrid-day-number{font-size:11px!important;padding:2px!important}
  .fc-daygrid-day-frame{min-height:60px!important}
  /* Hora na 1ª linha, título na 2ª — white-space:pre-line respeita \n */
  .fc-event{white-space:pre-line!important;overflow:hidden!important;line-height:1.3!important;font-size:10px!important;padding:1px 2px!important}
  .fc-event-title{display:block!important}
  .fc-daygrid-event-dot{border-width:4px!important;margin:0 2px!important}
}
@media(max-width:480px){
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .login-card{padding:28px 18px}
  .sidebar-header h3{font-size:14px}
  .nav-item{font-size:13px;padding:10px 12px}
  .evento-titulo{font-size:14px}
  .evento-meta{font-size:12px}
  .secao-header h2{font-size:16px}
}
@media(max-width:360px){.stats-grid{grid-template-columns:1fr}}
</style>

<body>
<div id="root"></div>

<!-- `defer` aqui também (não só nos scripts do <head>) — garante que este
     bloco só rode DEPOIS que FullCalendar/xlsx/jsPDF já terminaram de
     carregar (scripts com `defer` executam em ordem relativa do
     documento). Sem isso, um usuário JÁ LOGADO (token salvo, `render()`
     no fim deste bloco pode ir direto pro calendário) corria risco de
     `FullCalendar is not defined` numa rede lenta, se a chamada de rede
     de getEventos terminasse antes do download do script da agenda. -->
<script defer>
const API_URL = localStorage.getItem('apiUrl') ||
  'https://script.google.com/macros/s/AKfycbyEMl_w3xkIGcLX-qo589iIf8tZTGMIweVVfsBAYCXvf6UyUgyosCkNUVUI1NSEUuHZ9w/exec';

let token    = localStorage.getItem('token');
let usuario  = JSON.parse(localStorage.getItem('usuario') || 'null');
let eventos  = [];
let _salvandoEvento = false; // trava contra clique duplo em "Salvar" (ja causou eventos duplicados antes)
let todosEventos = [];
let calendar = null;
let _autoRefreshId = null;
let solicitacoesList = [];

// O Apps Script às vezes responde com uma página HTML de erro (fora do ar,
// sobrecarga) em vez do JSON esperado — parseJson troca o "Unexpected token
// '<'" cru do navegador por uma mensagem clara e acionável em português.
async function parseJson(res) {
  const texto = await res.text();
  try {
    return JSON.parse(texto);
  } catch (e) {
    throw new Error('Não foi possível se comunicar com o servidor agora. Verifique sua conexão e tente novamente em instantes.');
  }
}

async function api(action, data = {}) {
  try {
    const p = new URLSearchParams({ action, token: token || '', ...data });
    const res = await fetch(`${API_URL}?${p}`);
    const json = await parseJson(res);
    if (json && json.error) throw new Error(json.error);
    return json;
  } catch (e) {
    if (e.message && e.message.includes('autorizado')) logout();
    throw e;
  }
}

// Tenta de novo antes de desistir — pedido do usuário (2026-09-15): "às vezes
// quando carrega, não aparece as informações do histórico, abre a plataforma
// como se não tivesse nada lançado". Causa raiz: uma falha TRANSITÓRIA (rede
// lenta, ou o backend momentaneamente mais devagar por causa do cache de
// eventos — ver lerAbaCache/Code.gs) fazia `api('getEventos')` lançar uma
// única vez, e quem chamava trocava silenciosamente pra lista vazia — visto
// de fora, parece "a agenda está vazia", não "falhou ao carregar uma vez".
async function apiComRetry(action, data = {}, tentativas = 2) {
  let ultimoErro;
  for (let i = 0; i <= tentativas; i++) {
    try {
      return await api(action, data);
    } catch (e) {
      ultimoErro = e;
      // Token expirado é falha PERMANENTE (api() já chamou logout() aqui
      // dentro) — insistir só atrasa a tela de login aparecer de novo.
      if (e.message && e.message.includes('autorizado')) throw e;
      if (i < tentativas) await new Promise(r => setTimeout(r, 1200 * (i + 1)));
    }
  }
  throw ultimoErro;
}

async function apiPost(action, data = {}) {
  try {
    const url = `${API_URL}?action=${encodeURIComponent(action)}&token=${encodeURIComponent(token||'')}`;
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ ...data, token: token || '' })
    });
    const json = await parseJson(res);
    if (json && json.error) throw new Error(json.error);
    return json;
  } catch (e) {
    if (e.message && e.message.includes('autorizado')) logout();
    throw e;
  }
}

const sigla = orgao => {
  if (!orgao) return '';
  const norm = orgao.normalize('NFC').trim();
  if (SIGLAS[norm]) return SIGLAS[norm];
  const lower = norm.toLowerCase();
  const found = Object.keys(SIGLAS).find(k => k.normalize('NFC').toLowerCase() === lower);
  if (found) return SIGLAS[found];
  return norm.substring(0,6).toUpperCase();
};

async function render() {
  if (!token || !usuario) { $('root').innerHTML = htmlLogin(); return; }
  try {
    eventos = await apiComRetry('getEventos');
    if (!Array.isArray(eventos)) eventos = [];
  } catch(e) {
    // `api()` já chama logout() (e este, render() de novo) quando o erro é de
    // token expirado — se o token já sumiu, a tela de login já está no ar,
    // não sobrescreve ela com a tela de falha genérica.
    if (!token) return;
    $('root').innerHTML = htmlFalhaCarregamento(e);
    return;
  }

  if (usuario.tipo === 'orgao' && isUsuarioSecom()) {
    try { const r = await apiComRetry('getEventos', {todos:'true'}); eventos = Array.isArray(r) ? r : []; } catch(e) {}
    todosEventos = [];
  } else if (usuario.tipo === 'orgao' && usuario.orgao !== 'Gabinete do Prefeito') {
    try { const r = await apiComRetry('getEventos', {todos:'true'}); todosEventos = Array.isArray(r) ? r : []; } catch(e) { todosEventos = []; }
  } else {
    todosEventos = [];
  }

  calendar = null;
  if      (usuario.tipo === 'admin')    $('root').innerHTML = htmlAdmin();
  else if (usuario.tipo === 'prefeito') $('root').innerHTML = htmlPrefeito();
  else if (isUsuarioSecom())            $('root').innerHTML = htmlSecom();
  else                                  $('root').innerHTML = htmlSecretaria();
  inicializarApp();
  iniciarAutoRefresh();
}

async function enviarSolicitacao(ev) {
  ev.preventDefault();
  const err=$('erroSolic'),ok=$('okSolic');
  err.style.display='none'; ok.style.display='none';
  const senha=$('sSenha').value, senhaConf=$('sSenhaConf').value;
  if (/\s/.test(senha)) {
    err.textContent='❌ Espaço não é permitido na senha. Use um caractere especial no lugar.'; err.style.display='block'; return;
  }
  if (senha !== senhaConf) {
    err.textContent='❌ As senhas não coincidem.'; err.style.display='block'; return;
  }
  if (senha.length < 6) {
    err.textContent='❌ A senha deve ter pelo menos 6 caracteres.'; err.style.display='block'; return;
  }
  try {
    await api('solicitarAcesso',{
      nome:$('sNome').value, email:$('sEmail').value.trim(),
      login:$('sLogin').value.trim(), telefone:$('sTel').value.trim(),
      orgao:$('sOrgao').value,
      senha
    });
    ok.textContent='✅ Solicitação enviada! Um administrador vai revisar e liberar seu acesso em breve.';
    ok.style.display='block';
    $('formSolic').reset();
    setTimeout(()=>fecharModal('modalSolicitacao'),3000);
  } catch(e){
    err.textContent='❌ '+e.message; err.style.display='block';
    if (document.activeElement) document.activeElement.blur();
    err.scrollIntoView({behavior:'smooth', block:'center'});
  }
}

  const login=$('rLogin').value.trim();
  const senha=$('rSenha').value;
  const senha2=$('rSenha2').value;
  if(/\s/.test(senha)){err.textContent='❌ Espaço não é permitido na senha. Use um caractere especial no lugar.';err.style.display='block';return;}
  if(senha!==senha2){err.textContent='❌ As senhas não conferem.';err.style.display='block';return;}
  if(senha.length<4){err.textContent='❌ Senha muito curta (mínimo 4 caracteres).';err.style.display='block';return;}
  try {
    await api('recuperarSenha',{login,novaSenha:senha});
    ok.textContent='✅ Pedido enviado! Um administrador vai confirmar sua identidade e liberar a nova senha em breve.';
    ok.style.display='block';
    $('formRecup').reset();
    setTimeout(()=>fecharModal('modalRecuperar'),3000);
  } catch(e){ err.textContent='❌ '+e.message; err.style.display='block'; }
}

function iniciarAutoRefresh() {
  if (_autoRefreshId) { clearInterval(_autoRefreshId); _autoRefreshId = null; }
  const tipo = usuario?.tipo;
  if (tipo !== 'admin' && tipo !== 'orgao') return;
  _autoRefreshId = setInterval(async function() {
    // Aba em segundo plano (minimizada/outra janela em foco) não precisa de dado
    // fresco — pular evita bater na API sem ninguém olhando (multiplicado por
    // quantas abas as secretarias costumam deixar esquecidas abertas o dia todo).
    if (document.hidden) return;
    // Com height:'auto' o FullCalendar encolhe ao remover eventos e cresce de novo ao
    // adicionar — nesse intervalo a página fica mais baixa que o scroll atual e o
    // navegador "clampa" a rolagem pro topo. Travar a altura mínima da página ANTES
    // do reflow impede o encolhimento (em vez de só tentar restaurar depois que já
    // encolheu, que falha se o FullCalendar demorar mais que os frames de segurança).
    const scrollY = window.scrollY;
    const alturaAntes = document.body.scrollHeight;
    document.body.style.minHeight = alturaAntes + 'px';
    const restaurarScroll = () => requestAnimationFrame(() => requestAnimationFrame(() => {
      window.scrollTo(window.scrollX, scrollY);
      document.body.style.minHeight = '';
    }));
    try {
      if (isUsuarioSecom()) {
        try { const r = await api('getEventos',{todos:'true'}); if (Array.isArray(r)) eventos=r; } catch(e) { return; }
        if (calendar) { try { calendar.removeAllEvents(); calendar.addEventSource(eventosParaCalendario()); } catch(e) {} }
        renderizarMetrica();
        return;
      }
      try { const r = await api('getEventos'); if (Array.isArray(r)) eventos=r; } catch(e) { return; }
      if (tipo === 'admin') {
        if (calendar) { try { calendar.removeAllEvents(); calendar.addEventSource(eventosParaCalendario()); } catch(e) {} }
        renderizarMetrica();
      } else {
        if (usuario.orgao !== 'Gabinete do Prefeito') {
          try { const r = await api('getEventos',{todos:'true'}); if (Array.isArray(r)) todosEventos=r; } catch(e) {}
        }
        const cont1 = $('orgaoEventosHoje');
        if (cont1) { const hj=evtHoje(); cont1.innerHTML=hj.length===0?'<div class="empty">Nenhum evento hoje</div>':hj.map(e=>cardEvento(e)).join(''); }
        const cont2 = $('todosEventosHoje');
        if (cont2) { const todos=evtTodosHoje(); cont2.innerHTML=todos.length===0?'<div class="empty">Nenhum evento hoje</div>':todos.map(e=>cardEventoResumo(e)).join(''); }
        if (calendar) { try { calendar.removeAllEvents(); calendar.addEventSource(eventosParaCalendario()); } catch(e) {} }
      }
    } finally {
      restaurarScroll();
    }
  }, 60000);
}

function cardEvento(e, mostrarOrgao=false) {
  const pref=isPrefeito(e);
  const fsoc=isFundoSocial(e);
  const rec=podeVerRecorrencia(e);
  const temAnexo=!!(e.anexo_url||e.anexo_nome);
  return `
  <div class="evento-card${pref?' prefeito':fsoc?' fundosocial':rec?' recorrente':''}" onclick="verEvento('${e.id}')">
    <div class="evento-titulo">${e.titulo}
      ${pref?'<span class="tag-prefeito">🏛️ PREFEITO</span>':fsoc?'<span class="tag-fundosocial">🤝 FUNDO SOCIAL</span>':rec?`<span class="tag-recorrente">🔁 ${labelRecorrencia(e)}</span>`:''}
      ${mostrarOrgao?`<span class="tag-orgao">${(e.sigla_orgao||sigla(e.orgao))}</span>`:''}
      ${temAnexo?'<span style="font-size:12px;margin-left:6px">📎</span>':''}
    </div>
    <div class="evento-meta">
      <span>📅 ${fmtData(e.data_evento)}</span>
      ${fmtHora(e.data_evento,!isRecorrente(e))?`<span>🕐 ${fmtHora(e.data_evento,!isRecorrente(e))}</span>`:''}
      ${e.local?`<span>📍 ${e.local}</span>`:''}
      ${e.responsavel?`<span>👤 ${e.responsavel}</span>`:''}
      ${usuario?.tipo==='admin'&&e.publicado_por?`<span style="color:#888;font-size:11px">✍️ ${e.publicado_por} · ${fmtDH(e.data_publicacao)}</span>`:''}
    </div>
  </div>`;
}

function renderListaEventos(lista) {
  if (!lista||!lista.length) return '<div class="empty">Nenhum evento encontrado</div>';
  return lista.sort((a,b)=>new Date(b.data_evento)-new Date(a.data_evento))

// ════════════════ MÉTRICA DE USABILIDADE ════════════════
// Uma serie recorrente gera uma linha por ocorrencia (mesmo recorrencia_grupo) — conta
// como 1 lançamento só, não 1 por data gerada no calendário.
function contarLancamentosPorOrgao(lista) {
  const vistos = new Set();
  const contagem = {};
  lista.forEach(function(e) {
    if (!e.orgao) return;
    const chave = e.orgao + '|' + (e.recorrencia_grupo || ('__id_' + e.id));
    if (vistos.has(chave)) return;
    vistos.add(chave);
    contagem[e.orgao] = (contagem[e.orgao] || 0) + 1;
  });
  return contagem;
}

function todosOsOrgaos() {
  return Object.values(ORGAOS_LIST).reduce(function(acc, lista){ return acc.concat(lista); }, []);
}

function calcularMetricaUsabilidade() {
  const totalOrgaos = Object.values(ORGAOS_LIST).reduce(function(acc, lista){ return acc + lista.length; }, 0);
  const contagem = contarLancamentosPorOrgao(eventos);
  const orgaosAtivos = Object.keys(contagem).length;
  const totalEventos = Object.values(contagem).reduce(function(a,b){ return a+b; }, 0);
  const media = orgaosAtivos > 0 ? (totalEventos / orgaosAtivos).toFixed(1) : '0';
  const taxaEngajamento = totalOrgaos > 0 ? Math.round((orgaosAtivos / totalOrgaos) * 100) : 0;
  const ranking = Object.entries(contagem)
    .sort(function(a,b){ return b[1]-a[1]; })
    .map(function(item){ return { orgao: item[0], qtd: item[1], siglaOrgao: sigla(item[0]) }; });
  return { media: media, taxaEngajamento: taxaEngajamento, ranking: ranking, orgaosAtivos: orgaosAtivos, totalOrgaos: totalOrgaos, totalEventos: totalEventos };
}

// ════════════════ DADOS PARA EXPORTAÇÃO (PDF/Excel) ════════════════
// usuariosPorOrgao vem do backend (getContagemUsuarios) — só contagem, sem dado pessoal.
function calcularDadosExportacao(usuariosPorOrgao) {
  const todos = todosOsOrgaos();

  const hoje = new Date();
  const inicioSemana = new Date(hoje); inicioSemana.setDate(hoje.getDate() - hoje.getDay()); inicioSemana.setHours(0,0,0,0);
  const fimSemana = new Date(inicioSemana); fimSemana.setDate(inicioSemana.getDate() + 6); fimSemana.setHours(23,59,59,999);

  const totalPorOrgao = contarLancamentosPorOrgao(eventos);
  const eventosSemana = eventos.filter(function(e) {
    const d = new Date(e.data_evento);
    return d >= inicioSemana && d <= fimSemana;
  });
  const semanaPorOrgao = contarLancamentosPorOrgao(eventosSemana);

  const ranking = todos
    .map(function(o){ return { orgao: o, sigla: sigla(o) || o, qtd: totalPorOrgao[o] || 0 }; })
    .filter(function(r){ return r.qtd > 0; })
    .sort(function(a,b){ return b.qtd - a.qtd; });

  const semanal = todos
    .map(function(o){ return { orgao: o, sigla: sigla(o) || o, qtd: semanaPorOrgao[o] || 0 }; })
    .sort(function(a,b){ return b.qtd - a.qtd; });

  const semPublicacao = todos
    .filter(function(o){ return !totalPorOrgao[o]; })
    .map(function(o){ return { orgao: o, sigla: sigla(o) || o }; });

  const usuarios = todos
    .map(function(o){ return { orgao: o, sigla: sigla(o) || o, qtd: (usuariosPorOrgao && usuariosPorOrgao[o]) || 0 }; })
    .sort(function(a,b){ return b.qtd - a.qtd; });

  return { ranking: ranking, semanal: semanal, semPublicacao: semPublicacao, usuarios: usuarios,
    inicioSemana: inicioSemana, fimSemana: fimSemana };
}

function abrirModalMetricaDetalhada() {
  const m = calcularMetricaUsabilidade();
  const modalId = 'modalMetrica';
  let modal = $(modalId);
  if (!modal) {
    modal = document.createElement('div');
    modal.id = modalId;
    modal.className = 'modal-bg';
    modal.onclick = function(ev) { if (ev.target === modal) fecharModal(modalId); };
    document.body.appendChild(modal);

function inicializarApp() {
  if (usuario?.tipo==='admin') {
    carregarUsuarios();
    carregarSolicitacoes();
  }
  if (usuario?.tipo==='admin' || isUsuarioSecom()) {
    setTimeout(renderizarMetrica, 200);
  }
}

function mostrarView(id) {
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  const el=$(id); if(el) el.classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n=>{
    n.classList.toggle('active', n.getAttribute('onclick')?.includes(`'${id}'`));
  });

  // Calendário: zera padding do .main para o FC receber 100% da largura
  const main = document.querySelector('.main');
  if (main && isMobile()) {
    if (id === 'calendario') {
      main.style.paddingLeft  = '0';
      main.style.paddingRight = '0';
      // Sempre destrói e recria no mobile — garante medição correta do container
      if (calendar) { try { calendar.destroy(); } catch(e) {} calendar = null; }
    } else {
      main.style.paddingLeft  = '';
      main.style.paddingRight = '';
    }
  }

  if (id==='calendario') {
    // Double requestAnimationFrame: espera o navegador aplicar o CSS e reflowou
    // antes do FullCalendar medir offsetWidth do container
    requestAnimationFrame(() => requestAnimationFrame(() => {
      if (!calendar) iniciarCalendario();
      else { try { calendar.updateSize(); } catch(e) { calendar=null; iniciarCalendario(); } }
    }));
  }
  if (id==='dashboard' && usuario?.tipo==='admin') {
    setTimeout(renderizarMetrica, 100);
  }
  fecharMenuMobile();
}

function fecharMenuMobile() {

  const t=normBusca($('buscaEvt')?.value||'');
  const base=(usuario?.tipo==='admin'||usuario?.tipo==='prefeito')?eventos:evtDoUsuario();
  const filtrados=t?base.filter(e=>
    normBusca(e.titulo).includes(t)||normBusca(e.local).includes(t)||
    normBusca(e.responsavel).includes(t)||normBusca(e.orgao).includes(t)||
    normBusca((e.sigla_orgao||sigla(e.orgao))).includes(t)||normBusca(e.observacao).includes(t)):base;
  const cont=$('listaEvtConteudo');
  if(cont) {
    if(usuario?.tipo==='admin') cont.innerHTML=renderTabelaAdmin(filtrados);
    else cont.innerHTML=renderListaEventos(filtrados);

function abrirEdicao(id) {
  const e=eventos.find(x=>String(x.id)===String(id)); if(!e) return;
  fecharModal('modalEvento');
  const dt=e.data_evento||'';
  const horaAtual=dt.length>10?dt.substring(11,16):'';
  $('editId').value=e.id; $('editTitulo').value=e.titulo||'';
  $('editDataSoDia').value=dt.substring(0,10);
  $('editHora').value=horaAtual==='00:00'?'':horaAtual;
  $('editLocal').value=e.local||''; $('editResp').value=e.responsavel||'';
  $('editTel').value=e.telefone||''; $('editObs').value=e.observacao||'';
  $('editAnexoAtual').innerHTML=e.anexo_url
    ?`📎 Anexo atual: <a href="${e.anexo_url}" target="_blank">${e.anexo_nome||'ver arquivo'}</a> — selecione um novo arquivo abaixo para substituí-lo`
    :'';
  if($('editAnexo')) $('editAnexo').value='';
  if($('nomeAnexoEdit')) $('nomeAnexoEdit').textContent='';

  const painel=$('editPainelRepeticao');
  const recorrente=isRecorrente(e)&&e.recorrencia_grupo;
  $('editRecorrenciaGrupo').value=recorrente?e.recorrencia_grupo:'';
  if(recorrente){
    const irmaos=eventos.filter(x=>String(x.recorrencia_grupo)===String(e.recorrencia_grupo));
    const dias=new Set(irmaos.map(x=>new Date(x.data_evento).getDay()));
    const datasIrmaos=irmaos.map(x=>(x.data_evento||'').substring(0,10)).filter(Boolean).sort();
    $('editRepTipo').value=e.recorrencia_tipo;
    document.querySelectorAll('.editRepDia').forEach(cb=>{ cb.checked=dias.has(Number(cb.value)); });
    $('editRepInicio').value=datasIrmaos[0]||'';
    $('editRepFim').value=datasIrmaos[datasIrmaos.length-1]||'';
    painel.style.display='block';
    $('editGrupoData').style.display='none'; $('editGrupoHora').style.display='none';
    $('editDataSoDia').required=false;
    $('editBtnRepetirEvento').textContent='❌ Cancelar repetição';
  } else {
    painel.style.display='none';
    $('editGrupoData').style.display=''; $('editGrupoHora').style.display='';
    $('editDataSoDia').required=true;
    $('editBtnRepetirEvento').textContent='🔁 Repetir evento';
  }
  abrirModal('modalForm');
}

async function salvarEdicao(ev) {
  ev.preventDefault();
  if (_salvandoEvento) return; // evita clique duplo salvar/regerar a serie duas vezes
  const painel=$('editPainelRepeticao');
  const repetindo=painel&&painel.style.display!=='none';
  const btnSalvar=ev.target.querySelector('button[type="submit"]');

  const fileInput=$('editAnexo');
  let arquivo_base64='',arquivo_nome='',arquivo_tipo='';
  if(fileInput&&fileInput.files&&fileInput.files[0]){
    const f=fileInput.files[0];
    if(f.size>10*1024*1024){alert('❌ Arquivo muito grande. Máximo 10MB.');return;}
    arquivo_nome=f.name; arquivo_tipo=f.type;
    const prog=$('progressUploadEdit'),fill=$('progressFillEdit');
    if(prog){prog.style.display='block';if(fill)fill.style.width='30%';}
    arquivo_base64=await new Promise((res,rej)=>{
      const r=new FileReader();
      r.onload=e=>{if(fill)fill.style.width='80%';res(e.target.result.split(',')[1]);};
      r.onerror=rej; r.readAsDataURL(f);
    });
    if(fill)fill.style.width='100%';
    setTimeout(()=>{if(prog)prog.style.display='none';if(fill)fill.style.width='0%';},500);
  }
  const anexoPayload=arquivo_base64?{arquivo_base64,arquivo_nome,arquivo_tipo}:{};

  if (repetindo) {
    const dias=Array.from(document.querySelectorAll('.editRepDia:checked')).map(el=>Number(el.value));
    const repInicio=$('editRepInicio').value, repFim=$('editRepFim').value;
    if (!dias.length) { alert('❌ Selecione ao menos um dia da semana para repetir.'); return; }
    if (!repInicio||!repFim) { alert('❌ Informe a data de início e fim da repetição.'); return; }
    if (repFim<repInicio) { alert('❌ A data de fim deve ser depois da data de início.'); return; }
    const anoAtual=new Date().getFullYear();
    if (Number(repInicio.substring(0,4))!==anoAtual || Number(repFim.substring(0,4))!==anoAtual) {
      alert('❌ A repetição só pode ocorrer dentro do ano '+anoAtual+'.'); return;
    }
    const recorrencia={tipo:$('editRepTipo').value, dias, dataInicio:repInicio, dataFim:repFim};
    _salvandoEvento=true; if(btnSalvar) btnSalvar.disabled=true;
    try {
      const res=await apiPost('atualizarRecorrencia',{
        id:$('editId').value, recorrencia_grupo:$('editRecorrenciaGrupo').value,
        titulo:$('editTitulo').value, local:$('editLocal').value,
        responsavel:$('editResp').value, telefone:$('editTel').value, observacao:$('editObs').value,
        recorrencia, ...anexoPayload
      });
      fecharModal('modalForm'); await recarregarEventos();
      alert(`✅ Série atualizada! ${res.total} ocorrência(s) futura(s) gerada(s).`);
    } catch(e){ alert('❌ '+e.message); }
    finally { _salvandoEvento=false; if(btnSalvar) btnSalvar.disabled=false; }
    return;
  }

  const dataSoDia=$('editDataSoDia').value, hora=$('editHora').value;
  if (!dataSoDia) { alert('❌ Informe a data do evento.'); return; }
  const data_evento=dataSoDia+'T'+(hora||'00:00');
  _salvandoEvento=true; if(btnSalvar) btnSalvar.disabled=true;
  try {
    if ($('editRecorrenciaGrupo').value) {
      await apiPost('atualizarRecorrencia',{
        id:$('editId').value, recorrencia_grupo:$('editRecorrenciaGrupo').value,
        titulo:$('editTitulo').value, local:$('editLocal').value,
        responsavel:$('editResp').value, telefone:$('editTel').value, observacao:$('editObs').value,
        data_evento, ...anexoPayload
      });
    } else {
      const payload={id:$('editId').value,titulo:$('editTitulo').value,
        data_evento,local:$('editLocal').value,
        responsavel:$('editResp').value,telefone:$('editTel').value,observacao:$('editObs').value,
        ...anexoPayload};
      await (arquivo_base64?apiPost:api)('atualizarEvento',payload);
    }
    fecharModal('modalForm'); await recarregarEventos(); alert('✅ Evento atualizado!');
  } catch(e){ alert('❌ '+e.message); }
  finally { _salvandoEvento=false; if(btnSalvar) btnSalvar.disabled=false; }
}

let _excluirRecorrenteAlvo = null;

async function confirmarExcluir(id) {
  const e=eventos.find(x=>String(x.id)===String(id));
  if(!e) return;
  if (e.recorrencia_grupo) {
    _excluirRecorrenteAlvo = { id: e.id, grupo: e.recorrencia_grupo, titulo: e.titulo };

  if(!confirm(`Excluir o evento "${e?.titulo}"?`)) return;

}

async function excluirApenasEstaData() {

async function excluirSerieCompleta() {

async function criarEvento(ev) {
  ev.preventDefault();
  if (_salvandoEvento) return; // evita clique duplo criar o evento (ou a serie recorrente) duas vezes
  const painel=$('painelRepeticao');
  const repetindo=painel&&painel.style.display!=='none';
  const dataSoDia=$('evtDataSoDia').value;
  let recorrencia=null, dataVal='';

  if (repetindo) {
    const dias=Array.from(document.querySelectorAll('.repDia:checked')).map(el=>Number(el.value));
    const repInicio=$('repInicio').value, repFim=$('repFim').value;
    if (!dias.length) { avisar('❌ Selecione ao menos um dia da semana para repetir.'); return; }
    if (!repInicio||!repFim) { avisar('❌ Informe a data de início e fim da repetição.'); return; }
    if (repFim<repInicio) { avisar('❌ A data de fim deve ser depois da data de início.'); return; }
    const anoAtual=new Date().getFullYear();
    if (Number(repInicio.substring(0,4))!==anoAtual || Number(repFim.substring(0,4))!==anoAtual) {
      avisar('❌ A repetição só pode ocorrer dentro do ano '+anoAtual+'.'); return;
    }
    const hoje=new Date(); hoje.setHours(0,0,0,0);
    if (new Date(repInicio+'T00:00:00')<hoje) { avisar('❌ Não é permitido repetir a partir de uma data retroativa.'); return; }
    const fileInputCheck=$('evtAnexo');
    if (!fileInputCheck||!fileInputCheck.files||!fileInputCheck.files[0]) { avisar('❌ Anexe um documento com a variação de local/horário — obrigatório para eventos que se repetem.'); return; }
    recorrencia={tipo:$('repTipo').value, dias, dataInicio:repInicio, dataFim:repFim};
  } else {
    if (!dataSoDia) { avisar('❌ Informe a data do evento.'); return; }
    const hora=$('evtHora').value;
    if (!hora) { avisar('❌ Informe a hora do evento.'); return; }
    dataVal=dataSoDia+'T'+hora;
    if (new Date(dataVal)<new Date()) { avisar('❌ Não é permitido criar eventos com data ou hora retroativa.'); return; }
  }

  const fileInput=$('evtAnexo');
  let arquivo_base64='',arquivo_nome='',arquivo_tipo='';
  if(fileInput&&fileInput.files&&fileInput.files[0]){
    const f=fileInput.files[0];
    if(f.size>10*1024*1024){avisar('❌ Arquivo muito grande. Máximo 10MB.');return;}
    arquivo_nome=f.name; arquivo_tipo=f.type;
    const prog=$('progressUpload'),fill=$('progressFill');
    if(prog){prog.style.display='block';if(fill)fill.style.width='30%';}
    arquivo_base64=await new Promise((res,rej)=>{
      const r=new FileReader();
      r.onload=e=>{if(fill)fill.style.width='80%';res(e.target.result.split(',')[1]);};
      r.onerror=rej; r.readAsDataURL(f);
    });
    if(fill)fill.style.width='100%';
    setTimeout(()=>{if(prog)prog.style.display='none';if(fill)fill.style.width='0%';},500);
  }
  _salvandoEvento=true;
  const btnSalvar=ev.target.querySelector('button[type="submit"]');
  if(btnSalvar) btnSalvar.disabled=true;
  try {
    const payload={titulo:$('evtTitulo').value,
      local:$('evtLocal')?.value||'',responsavel:$('evtResp')?.value||'',
      telefone:$('evtTel')?.value||'',observacao:$('evtObs').value,
      arquivo_base64,arquivo_nome,arquivo_tipo};
    if (recorrencia) payload.recorrencia=recorrencia;
    else payload.data_evento=dataVal;

    const res=(arquivo_base64||recorrencia)?await apiPost('criarEvento',payload):await api('criarEvento',payload);
    ev.target.reset(); if($('nomeAnexo'))$('nomeAnexo').textContent='';
    if(painel) painel.style.display='none';
    if($('grupoDataEvento')) $('grupoDataEvento').style.display='';
    if($('grupoHoraEvento')) $('grupoHoraEvento').style.display='';
    if($('evtDataSoDia')) $('evtDataSoDia').required=true;
    if($('evtHora')) $('evtHora').required=true;
    if($('btnRepetirEvento')) $('btnRepetirEvento').textContent='🔁 Repetir evento';
    await recarregarEventos();
    alert(res&&res.total>1?`✅ ${res.total} eventos criados (repetição)!`:'✅ Evento criado com sucesso!');
    mostrarView(usuario?.tipo==='prefeito'?'agendaPref':'meusEventos');
  } catch(e){ alert('❌ '+e.message); }
  finally { _salvandoEvento=false; if(btnSalvar) btnSalvar.disabled=false; }
}

async function recarregarEventos() {
  try { const r=await api('getEventos'); if(Array.isArray(r)) eventos=r; } catch(e){}
  const cont=$('listaEvtConteudo');
  if(cont){
    if(usuario?.tipo==='admin') cont.innerHTML=renderTabelaAdmin(eventos);
    else cont.innerHTML=renderListaEventos(usuario?.tipo==='prefeito'?eventos:evtDoUsuario());
  }
  if(calendar){
    try{ calendar.removeAllEvents(); calendar.addEventSource(eventosParaCalendario()); }
    catch(e){ calendar=null; }
  }
  if(usuario?.tipo==='admin') renderizarMetrica();
}

function eventosParaCalendario() {
  return evtDoUsuario().map(e=>{
    const elevado=usuario?.tipo==='admin'||usuario?.tipo==='prefeito'||isUsuarioSecom();
    const pref=isPrefeito(e), fsoc=isFundoSocial(e), rec=podeVerRecorrencia(e);
    const destacado=pref||fsoc||rec;
    const hora=fmtHora(e.data_evento,!isRecorrente(e));
    const tagRec=rec?(' 🔁 '+labelRecorrencia(e)):'';
    return {
      id:String(e.id),
      title:isMobile()
        ?(elevado
            ?`${hora}\n${e.sigla_orgao||sigla(e.orgao)}${rec?' 🔁':''}`
            :`${hora}\n${e.titulo}${rec?' 🔁':''}`)
        :(elevado
            ?`${hora?hora+' ':''}${e.sigla_orgao||sigla(e.orgao)}: ${e.titulo}${tagRec}`
            :`${e.titulo}${tagRec}`),
      start:e.data_evento,
      // Bloco colorido so pros eventos especiais (Prefeito/Fundo Social/recorrente) — os demais ficam no modo compacto padrão
      display:destacado?'block':'auto',
      className:pref?(isMobile()?'prefeito-event-mobile':'prefeito-event')
        :fsoc?(isMobile()?'fundosocial-event-mobile':'fundosocial-event')
        :rec?(isMobile()?'recorrente-event-mobile':'recorrente-event')
        :'',
      extendedProps:{eventoId:e.id}
    };
  });
}

function iniciarCalendario() {
  const el=$('cal'); if(!el) return;
  calendar=new FullCalendar.Calendar(el,{
    locale:'pt-br', initialView:'dayGridMonth',
    headerToolbar:{left:'prev,next today',center:'title',right:'dayGridMonth,dayGridWeek,listMonth'},
    buttonText:{today:'Hoje',month:'Mês',week:'Semana',list:'Lista'},
    noEventsText:'Nenhum evento para exibir',
    events:eventosParaCalendario(),
    eventClick:info=>verEvento(info.event.extendedProps.eventoId),
    dateClick:info=>{
      const lista=evtDoUsuario().filter(e=>{
        const de=new Date(e.data_evento); de.setHours(0,0,0,0);
        return de.getTime()===new Date(info.dateStr).getTime();
      }).sort((a,b)=>new Date(a.data_evento)-new Date(b.data_evento));
      if(lista.length) abrirModalEventosDoDia(info.dateStr, lista);
    },
    height:'auto'
  });
  calendar.render();
}

// Logo é sempre servido do mesmo domínio do app — sem crossOrigin (não é preciso
// pra mesma origem, e só atrapalha em teste local via file://).
function carregarImagemComoDataURL(src, ladoMaximoPx) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      try {
        // Redimensiona pro tamanho real de impressão (a logo sai a 30mm no PDF) —
        // embutir o PNG original em resolução de ícone de app deixa o arquivo gigante à toa.
        const escala = ladoMaximoPx ? Math.min(1, ladoMaximoPx / Math.max(img.naturalWidth, img.naturalHeight)) : 1;
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.naturalWidth * escala);
        canvas.height = Math.round(img.naturalHeight * escala);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/png'));
      } catch (e) { resolve(null); }
    };
    img.onerror = () => resolve(null);
    img.src = src;
  });
}

function arrayBufferParaBase64(buffer) {
  let binary = '';
  const bytes = new Uint8Array(buffer);
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) binary += String.fromCharCode.apply(null, bytes.subarray(i, i+chunk));
  return btoa(binary);
}

// A Inter é a fonte da plataforma (body{font-family:'Inter'}) — embutida no PDF pra
// manter a mesma identidade visual do app, não a Helvetica genérica padrão do jsPDF.
async function carregarFonteBase64(url) {
  try { return arrayBufferParaBase64(await (await fetch(url)).arrayBuffer()); }
  catch (e) { return null; }
}

// Capa institucional — página 1 do relatório. Mesma tipografia e o mesmo azul/marinho
// da identidade visual do app (não uma paleta/fonte genérica) e assinatura SECOM/ASCOM.
function desenharCapaPDF(pdf, logoDataUrl, totalEventos, top5, FONTE) {
  const pageW = 210;
  const NAVY_DEEP = [0,51,102], ACCENT = [0,77,153];
  const INK = [26,42,58], INK_SOFT = [91,102,114], LINE = [215,222,229], CHIP = [232,244,248];

  pdf.setFillColor(...NAVY_DEEP); pdf.rect(0,0,pageW,4,'F');
  pdf.setFillColor(...ACCENT); pdf.rect(0,4,pageW,1.2,'F');

  let y = 34;
  if (logoDataUrl) {
    const s = 30;
    pdf.addImage(logoDataUrl, 'PNG', (pageW-s)/2, y, s, s);
    y += s + 12;
  } else { y += 8; }

  pdf.setFont(FONTE,'bold'); pdf.setFontSize(22); pdf.setTextColor(...NAVY_DEEP);
  pdf.text('Plataforma de Agenda', pageW/2, y, {align:'center'});
  y += 8;
  pdf.setFont(FONTE,'bold'); pdf.setFontSize(10.5); pdf.setTextColor(...ACCENT);
  pdf.text('R E L A T Ó R I O   G E R E N C I A L   D E   U S O', pageW/2, y, {align:'center'});
  y += 14;

  pdf.setDrawColor(...LINE); pdf.setLineWidth(0.4);
  pdf.line(pageW/2-24, y, pageW/2+24, y);
  y += 12;

  pdf.setFont(FONTE,'normal'); pdf.setFontSize(13); pdf.setTextColor(...NAVY_DEEP);
  pdf.text('Prefeitura Municipal de Presidente Prudente', pageW/2, y, {align:'center'});
  y += 18;

  const cardW = 80, cardH = 26, cardX = (pageW-cardW)/2;
  pdf.setFillColor(...CHIP);
  pdf.roundedRect(cardX, y, cardW, cardH, 3, 3, 'F');
  pdf.setFont(FONTE,'bold'); pdf.setFontSize(20); pdf.setTextColor(...NAVY_DEEP);
  pdf.text(String(totalEventos), pageW/2, y+15, {align:'center'});
  pdf.setFont(FONTE,'bold'); pdf.setFontSize(8.5); pdf.setTextColor(...INK_SOFT);
  pdf.text('TOTAL DE EVENTOS', pageW/2, y+21.5, {align:'center'});
  y += cardH + 16;

  pdf.setFont(FONTE,'bold'); pdf.setFontSize(13); pdf.setTextColor(...NAVY_DEEP);
  pdf.text('Top 5 — Órgãos Mais Ativos', pageW/2, y, {align:'center'});
  y += 10;

  const chartX = 40, chartW = pageW - chartX*2;
  if (top5.length) {
    const maxQtd = Math.max.apply(null, top5.map(r=>r.qtd));
    const barH = 7, gap = 5.5;
    top5.forEach((r,i) => {
      const by = y + i*(barH+gap);
      pdf.setFont(FONTE,'bold'); pdf.setFontSize(9); pdf.setTextColor(...INK_SOFT);
      pdf.text(String(i+1), chartX, by+barH-1.8);
      pdf.setTextColor(...INK);
      pdf.text(r.siglaOrgao || r.sigla, chartX+6, by+barH-1.8);
      const labelW = 28;
      const barMaxW = chartW - labelW - 12;
      const barW = maxQtd>0 ? Math.max((r.qtd/maxQtd)*barMaxW, 2) : 2;
      pdf.setFillColor(...ACCENT);
      pdf.roundedRect(chartX+labelW, by, barW, barH, 1, 1, 'F');
      pdf.setFont(FONTE,'bold'); pdf.setFontSize(9); pdf.setTextColor(...NAVY_DEEP);
      pdf.text(String(r.qtd), chartX+labelW+barW+3, by+barH-1.8);
    });
  } else {
    pdf.setFont(FONTE,'normal'); pdf.setFontSize(10); pdf.setTextColor(...INK_SOFT);
    pdf.text('Nenhum evento publicado ainda.', pageW/2, y, {align:'center'});
  }

  // Rodapé institucional: data de exportação junto da assinatura, não separada
  pdf.setDrawColor(...LINE); pdf.setLineWidth(0.3);
  pdf.line(30, 262, pageW-30, 262);
  const agora = new Date();
  const dataHora = `Exportado em ${agora.toLocaleDateString('pt-BR')} às ${agora.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`;
  pdf.setFont(FONTE,'normal'); pdf.setFontSize(8.5); pdf.setTextColor(...INK_SOFT);
  pdf.text(dataHora, pageW/2, 269, {align:'center'});
  pdf.setFont(FONTE,'bold'); pdf.setFontSize(10); pdf.setTextColor(...NAVY_DEEP);
  pdf.text('Secretaria de Comunicação — SECOM', pageW/2, 276, {align:'center'});
  pdf.setFont(FONTE,'normal'); pdf.setFontSize(9); pdf.setTextColor(...INK_SOFT);
  pdf.text('Assessoria de Comunicação — ASCOM', pageW/2, 281.5, {align:'center'});
  pdf.text('Prefeitura Municipal de Presidente Prudente', pageW/2, 286.5, {align:'center'});
}

async function exportarPDF() {

    const [logoDataUrl, interRegularB64, interBoldB64] = await Promise.all([
      carregarImagemComoDataURL('Logo plataforma de Agenda.png', 400),
      carregarFonteBase64('Inter-Regular.ttf'),
      carregarFonteBase64('Inter-Bold.ttf')
    ]);
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF('p','mm','a4');

    // Mesma fonte do app (Inter) do início ao fim do PDF — cai pra Helvetica só se o
    // carregamento das fontes falhar (ex: sem rede pro fetch dos .ttf).
    let FONTE = 'helvetica';
    if (interRegularB64 && interBoldB64) {
      try {
        pdf.addFileToVFS('Inter-Regular.ttf', interRegularB64);
        pdf.addFont('Inter-Regular.ttf', 'Inter', 'normal');
        pdf.addFileToVFS('Inter-Bold.ttf', interBoldB64);
        pdf.addFont('Inter-Bold.ttf', 'Inter', 'bold');

    }));

      subtituloSecao(`${d.semPublicacao.length} órgão(s) ainda não publicaram nenhum evento`, 25);
      pdf.autoTable(Object.assign({}, estiloTabela, {
        startY: 30,
        head: [['Órgão','Sigla']],
        body: d.semPublicacao.map(o=>[o.orgao, o.sigla])
      }));
    } else {
      pdf.setFont(FONTE,'normal'); pdf.setFontSize(11); pdf.setTextColor(...CINZA);
      pdf.text('Todos os órgãos já publicaram pelo menos um evento.', 14, 30);
    }

    pdf.save(`dashboard_${new Date().toISOString().split('T')[0]}.pdf`);
  } catch(e){alert('❌ Erro ao gerar PDF: '+e.message);}
}

// ════════════════ USUÁRIOS ════════════════
async function carregarUsuarios() {
  const cont=$('listaUsuarios'); if(!cont) return;
  try {
    const lista=await api('getUsuarios');
    if(!Array.isArray(lista)){cont.innerHTML='<div class="empty">Erro ao carregar</div>';return;}
    const tipoLabel={admin:'Administrador',prefeito:'Prefeito',orgao:'Órgão'};
    cont.innerHTML=`<div class="tabela-wrap"><table>
      <thead><tr><th>Nome</th><th>Login</th><th>Órgão</th><th>Sessão</th><th>Ativo</th><th>Ações</th></tr></thead>
      <tbody>${lista.map(u=>`
        <tr${u.tipo==='prefeito'?' class="pref-row"':''}>
          <td>${u.nome}</td><td>${u.login}</td><td>${sigla(u.orgao)||'—'}</td>
          <td>${tipoLabel[u.tipo]||u.tipo}</td>
          <td>${String(u.ativo).toUpperCase()==='TRUE'?'✅':'❌'}</td>
          <td><div class="btns-row">
            <button class="btn btn-amarelo" onclick="resetarSenha('${u.id}','${u.nome}')">🔑</button>
            <button class="btn btn-vermelho" onclick="excluirUsuario('${u.id}','${u.nome}')">🗑️</button>
          </div></td>
        </tr>`).join('')}
      </tbody></table></div>`;
  } catch(e){cont.innerHTML='<div class="empty">Erro: '+e.message+'</div>';}
}

function abrirModalNovoUsuario() {
  $('modalUsuarioTitulo').textContent='Novo Usuário';
  $('formUsuario').reset(); $('uId').value='';
  $('campoOrgao').style.display='none';
  abrirModal('modalUsuario');
}

async function salvarUsuario(ev) {
  ev.preventDefault();
  const tipo=$('uTipo').value;
  const orgao=tipo==='prefeito'?'Gabinete do Prefeito':tipo==='admin'?'':$('uOrgao').value;
  if(tipo==='orgao'&&!orgao){alert('Selecione o órgão/secretaria.');return;}
  if(/\s/.test($('uSenha').value)){alert('❌ Espaço não é permitido na senha. Use um caractere especial no lugar.');return;}
  try {
    await api('criarUsuario',{login:$('uLogin').value.trim(),nome:$('uNome').value,
      email:$('uEmail').value.trim(),senha:$('uSenha').value,tipo,orgao});
    fecharModal('modalUsuario'); await carregarUsuarios(); alert('✅ Usuário criado!');
  } catch(e){alert('❌ '+e.message);}
}

async function resetarSenha(id, nome) {
  const nova=prompt(`Nova senha para ${nome}:`); if(!nova) return;
  try { await api('resetarSenha',{usuarioId:id,novaSenha:nova}); alert('✅ Senha alterada!'); }
  catch(e){alert('❌ '+e.message);}
}

async function excluirUsuario(id, nome) {
  if(!confirm(`Excluir o usuário "${nome}"?`)) return;
  try { await api('excluirUsuario',{id}); await carregarUsuarios(); alert('✅ Usuário excluído!'); }
  catch(e){alert('❌ '+e.message);}
}

// ════════════════ SOLICITAÇÕES ════════════════
async function carregarSolicitacoes() {
  const cont=$('listaSolicitacoes'); if(!cont) return;
  try {
    const lista=await api('getSolicitacoes');
    solicitacoesList=Array.isArray(lista)?lista:[];
    const pendentes=solicitacoesList.filter(s=>s.status==='pendente');
    const badge=$('badgeSolic');
    if(badge){badge.textContent=pendentes.length;badge.style.display=pendentes.length>0?'inline':'none';}
    if(!solicitacoesList.length){cont.innerHTML='<div class="empty">Nenhuma solicitação</div>';return;}
    cont.innerHTML=`<div class="tabela-wrap"><table>
      <thead><tr><th>Nome</th><th>Login</th><th>E-mail</th><th>Órgão</th><th>Tipo</th><th>Data</th><th>Status</th><th>Ações</th></tr></thead>
      <tbody>${solicitacoesList.map(s=>`
        <tr>
          <td>${s.nome||'—'}</td><td>${s.login}</td><td>${s.email}</td>
          <td>${sigla(s.orgao)||'—'}</td>
          <td>${s.tipoSolicitacao==='recuperacao'?'🔑 Recuperar Senha':'👤 Novo Acesso'}</td>
          <td style="font-size:11px">${fmtDH(s.data_solicitacao)}</td>
          <td><span style="color:${s.status==='pendente'?'#e67e00':'#28a745'};font-weight:600">${s.status}</span></td>
          <td><div class="btns-row">
            ${s.status==='pendente'?(s.tipoSolicitacao==='recuperacao'
              ?`<button class="btn btn-amarelo" onclick="resetarSenhaSolicitacao('${s.id}','${s.login}')">🔑 Resetar</button>`
              :`<button class="btn btn-verde" onclick="aprovarSolicitacao('${s.id}')">✅ Aprovar</button>`):''}
            ${s.status==='pendente'?`<button class="btn btn-vermelho" onclick="rejeitarSolicitacao('${s.id}')">❌</button>`:''}
            <button class="btn btn-cinza" onclick="excluirSolicitacaoUI('${s.id}')" title="Excluir definitivamente">🗑️</button>
          </div></td>
        </tr>`).join('')}
      </tbody></table></div>`;
  } catch(e){cont.innerHTML='<div class="empty">Erro: '+e.message+'</div>';}
}

async function aprovarTodasPendentes() {
  const pendentes = solicitacoesList.filter(s => s.status === 'pendente');
  if (!pendentes.length) { alert('Não há solicitações pendentes.'); return; }
  if (!confirm(`Aprovar todas as ${pendentes.length} solicitações pendentes?\n\nContas de "Novo Acesso" serão criadas com a senha que o usuário escolheu. Pedidos de "Recuperar Senha" serão marcados como resolvidos (o usuário já pode redefinir sozinho pelo botão "Recuperar Senha" da tela de login).`)) return;

  let criadas = 0, resolvidas = 0, falhas = 0;
  for (const s of pendentes) {
    try {
      if (s.tipoSolicitacao === 'recuperacao') {
        await api('atualizarSolicitacao', { id: s.id, status: 'resolvido' });
        resolvidas++;
      } else {
        const senha = s.senha || (s.login + '@PP');
        await api('criarUsuario', { login: s.login, nome: s.nome, email: s.email, senha, tipo: 'orgao', orgao: s.orgao });
        await api('atualizarSolicitacao', { id: s.id, status: 'aprovado' });
        criadas++;
      }
    } catch (e) { falhas++; }
  }
  await carregarSolicitacoes(); await carregarUsuarios();
  alert(`✅ Processamento concluído.\n\nContas criadas: ${criadas}\nRecuperações resolvidas: ${resolvidas}\nFalhas (login/e-mail já existente, etc.): ${falhas}`);
}

async function aprovarSolicitacao(id) {
  const s=solicitacoesList.find(x=>String(x.id)===String(id)); if(!s) return;
  if(!confirm(`Aprovar solicitação de "${s.nome}" (${s.login}) para ${s.orgao||'—'}?`)) return;
  // Usa a senha escolhida pelo usuário na solicitação; fallback para padrão
  const senha = s.senha || (s.login + '@PP');
  const senhaGerada = !s.senha;
  try {
    await api('criarUsuario',{login:s.login,nome:s.nome,email:s.email,senha,tipo:'orgao',orgao:s.orgao});
    await api('atualizarSolicitacao',{id,status:'aprovado'});
    await carregarSolicitacoes(); await carregarUsuarios();
    alert(senhaGerada
      ? `✅ Usuário "${s.nome}" aprovado!\n\nSenha gerada automaticamente: ${senha}\nComunique ao usuário para alterar.`
      : `✅ Usuário "${s.nome}" aprovado!\n\nO usuário já definiu sua própria senha.`);
  } catch(e){alert('❌ '+e.message);}
}

async function resetarSenhaSolicitacao(id, login) {
  const nova=prompt(`Nova senha para "${login}":`); if(!nova) return;
  try {
    const lista=await api('getUsuarios');
    const user=lista.find(u=>u.login===login||u.email===login);
    if(!user){alert('Usuário não encontrado na base.');return;}
    await api('resetarSenha',{usuarioId:user.id,novaSenha:nova});
    await api('atualizarSolicitacao',{id,status:'resolvido'});
    await carregarSolicitacoes(); alert('✅ Senha redefinida!');
  } catch(e){alert('❌ '+e.message);}
}

async function rejeitarSolicitacao(id) {
  if(!confirm('Rejeitar esta solicitação?')) return;
  try {
    await api('atualizarSolicitacao',{id,status:'rejeitado'});
    await carregarSolicitacoes(); alert('✅ Solicitação rejeitada.');
  } catch(e){alert('❌ '+e.message);}
}

async function excluirSolicitacaoUI(id) {
  if(!confirm('Excluir esta solicitação definitivamente? Essa ação não pode ser desfeita.')) return;
  try {
    await api('excluirSolicitacao',{id});
    await carregarSolicitacoes();
  } catch(e){alert('❌ '+e.message);}
}

// interacao com input/teclado/seletor de arquivo.
function avisar(msg){ if(document.activeElement&&document.activeElement.blur) document.activeElement.blur(); setTimeout(()=>alert(msg),50); }

function abrirModal(id){const el=$(id);if(el)el.classList.add('aberto');}
function fecharModal(id){const el=$(id);if(el)el.classList.remove('aberto');}

const ICON_OLHO = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>';
const ICON_OLHO_OFF = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a20.3 20.3 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a20.3 20.3 0 0 1-2.68 3.75M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>';
function toggleSenha(id, btn) {
  const input = $(id); if (!input) return;
  const oculto = input.type === 'password';
  input.type = oculto ? 'text' : 'password';
  btn.innerHTML = oculto ? ICON_OLHO_OFF : ICON_OLHO;
  btn.setAttribute('aria-label', oculto ? 'Ocultar senha' : 'Mostrar senha');
}

function bloquearEspacoSenha(input) {
  if (!/\s/.test(input.value)) return;
  input.value = input.value.replace(/\s/g, '');
  const grupo = input.closest('.form-group');
  if (!grupo) return;
  let aviso = grupo.querySelector('.aviso-espaco-senha');
  if (!aviso) {
    aviso = document.createElement('div');
    aviso.className = 'aviso-espaco-senha';
    aviso.textContent = '❌ Espaço não é permitido na senha. Use um caractere especial no lugar.';
    grupo.appendChild(aviso);
  }
  aviso.style.display = 'block';
  clearTimeout(aviso._timeout);
  aviso._timeout = setTimeout(() => { aviso.style.display = 'none'; }, 3000);
}

async function exportarExcel() {
  const dados=evtDoUsuario().map(e=>({'Título':e.titulo,'Data':fmtDH(e.data_evento,!isRecorrente(e)),'Local':e.local,
    'Órgão':(e.sigla_orgao||sigla(e.orgao)),'Responsável':e.responsavel,'Telefone':e.telefone,'Descrição':e.observacao,'Publicado por':e.publicado_por}));
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(dados), 'Eventos');

  const usuariosPorOrgao = await buscarContagemUsuariosParaExport();
  const d = calcularDadosExportacao(usuariosPorOrgao);
  const totalRanking = d.ranking.reduce((a,r)=>a+r.qtd,0);

  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
    d.usuarios.map(u=>({'Órgão':u.orgao,'Sigla':u.sigla,'Usuários Cadastrados':u.qtd}))
  ), 'Usuários por Órgão');

  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
    d.ranking.map((r,i)=>({'Posição':i+1,'Órgão':r.orgao,'Sigla':r.sigla,'Lançamentos':r.qtd,'% do Total':totalRanking?Math.round(r.qtd/totalRanking*100):0}))
  ), 'Ranking de Uso');

  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
    d.semanal.map(s=>({'Órgão':s.orgao,'Sigla':s.sigla,'Lançamentos na Semana':s.qtd}))
  ), 'Lançamentos Semanais');

  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(
    d.semPublicacao.length ? d.semPublicacao.map(o=>({'Órgão':o.orgao,'Sigla':o.sigla}))
      : [{'Órgão':'Todos os órgãos já publicaram pelo menos um evento','Sigla':''}]
  ), 'Sem Publicação');

  XLSX.writeFile(wb,'agenda-prefeitura.xlsx');
}

});

render();
